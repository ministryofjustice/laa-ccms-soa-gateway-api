pluginManagement {
    repositories {
        maven {
            url = uri('https://central.sonatype.com/repository/maven-snapshots/')
            mavenContent {
                snapshotsOnly()
            }
        }
        mavenCentral()
        gradlePluginPortal()
    }
}

dependencyResolutionManagement {
    repositories {
        maven { url = "https://build.shibboleth.net/maven/releases/" }
    }
}

rootProject.name = 'laa-ccms-soa-gateway-api'

include 'soa-gateway-api'
include 'soa-gateway-service'
