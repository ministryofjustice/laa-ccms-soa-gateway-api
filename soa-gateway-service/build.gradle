plugins {
    id 'uk.co.boothen.gradle.wsimport' version '0.25'
}

apply plugin: 'uk.gov.justice.service.laa.laa-spring-boot-gradle-plugin'
apply plugin: "com.diffplug.spotless"

configurations {
    mockitoAgent {
        transitive = false
    }
}

configurations.configureEach {
    resolutionStrategy.eachDependency { details ->
        if (details.requested.group == 'org.apache.tomcat.embed') {
            details.useVersion '11.0.23'
            details.because 'Temporary override to remediate vulnerability'
        }
        if (details.requested.group == 'org.bouncycastle') {
            details.useVersion '1.84'
            details.because 'Temporary override to remediate vulnerability'
        }
        if (details.requested.group == 'com.fasterxml.jackson.core' && details.requested.name == 'jackson-databind') {
            details.useVersion '2.22.1'
            details.because 'Temporary override to remediate vulnerability'
        }
        if (details.requested.group == 'com.fasterxml.jackson.core' && details.requested.name == 'jackson-annotations') {
            details.useVersion '2.22'
            details.because 'Temporary override to remediate vulnerability'
        }
        if (details.requested.group == 'ch.qos.logback') {
            details.useVersion '1.5.36'
            details.because 'Temporary override to remediate vulnerability'
        }
        if (details.requested.group == 'org.apache.logging.log4j') {
            details.useVersion '2.25.5'
            details.because 'Temporary override to remediate vulnerability'
        }
        if (details.requested.group == 'org.apache.httpcomponents.core5') {
            details.useVersion '5.4.3'
            details.because 'Temporary override to remediate vulnerability'
        }
        if (details.requested.group == 'tools.jackson.core') {
            details.useVersion '3.2.1'
            details.because 'Temporary override to remediate vulnerability'
        }
        if (details.requested.group == 'org.bouncycastle') {
            details.useVersion '1.85'
            details.because 'Temporary override to remediate vulnerability'
        }
        // 5.6.3 targets httpcore5 5.4.3, matching the override above.
        if (details.requested.group == 'org.apache.httpcomponents.client5') {
            details.useVersion '5.6.3'
            details.because 'Temporary Snyk override (SNYK-JAVA-ORGAPACHEHTTPCOMPONENTSCLIENT5-18857813) until upgraded in Spring Boot'
        }
    }
}

dependencies {

    constraints {
    }

    implementation project(':soa-gateway-api')

    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'io.micrometer:micrometer-tracing-bridge-brave'

    implementation 'org.springframework.boot:spring-boot-starter-validation'

    //Metrics
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'io.micrometer:micrometer-registry-prometheus'

    //Enable access token authentication
    implementation 'uk.gov.justice.service.laa:laa-spring-boot-starter-auth'

    //Enable Swagger UI
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:3.1.0'

    //Required for pagination
    implementation 'org.springframework.data:spring-data-commons'

    // For mock Contract Details only
    // Prefer standalone version, see: https://github.com/wiremock/wiremock/issues/1760
    implementation 'org.wiremock:wiremock-standalone:3.13.2'

    // Exclude guava from spring-ws-security
    implementation('org.springframework.ws:spring-ws-security') {
        exclude group: 'com.google.guava', module: 'guava'
        exclude group: 'org.springframework.security', module: 'spring-security-core'
    }
    // Overriding transitive dependency
    implementation 'com.google.guava:guava:33.6.0-jre'
    implementation 'org.modelmapper:modelmapper:3.2.6'
    implementation 'org.apache.commons:commons-lang3:3.20.0'
    implementation "org.mapstruct:mapstruct:1.6.3"
    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'
    annotationProcessor "org.mapstruct:mapstruct-processor:1.6.3"

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    // Adding exclusion for legacy JUnit 4
    testImplementation('org.springframework.ws:spring-ws-test') {
        exclude group: 'junit', module: 'junit'
    }
    testImplementation 'org.mockito:mockito-core:5.23.0'
    testImplementation 'org.junit.jupiter:junit-jupiter:6.1.2'

    mockitoAgent "org.mockito:mockito-core"
}

wsimport {
    extension = true
    verbose = false
    quiet = true
    debug = false
    xadditionalHeaders = true

    wsdl('Schema/BusinessServices/CCMS/CaseManagement/NotificationServices.wsdl') {
        xjcarg("-XautoNameResolution")
        wsdlLocation = 'classpath:wsdl/Schema/BusinessServices/CCMS/CaseManagement/NotificationServices.wsdl'
    }

    wsdl('/Schema/BusinessServices/CCMS/Common/GetContractDetails.wsdl') {
        xjcarg("-XautoNameResolution")
        wsdlLocation = 'classpath:wsdl/Schema/BusinessServices/CCMS/Common/GetContractDetails.wsdl'
    }

    wsdl('/Schema/BusinessServices/CCMS/ClientManagement/ClientServices.wsdl') {
        xjcarg("-XautoNameResolution")
        wsdlLocation = 'classpath:wsdl/Schema/BusinessServices/CCMS/ClientManagement/ClientServices.wsdl'
    }

    wsdl('/Schema/BusinessServices/CCMS/Common/GetReferencedata.wsdl') {
        xjcarg("-XautoNameResolution")
        wsdlLocation = 'classpath:wsdl/Schema/BusinessServices/CCMS/Common/GetReferencedata.wsdl'
    }

    wsdl('Schema/BusinessServices/CCMS/CaseManagement/CaseServices.wsdl') {
        xjcarg("-XautoNameResolution")
        wsdlLocation = 'classpath:wsdl/Schema/BusinessServices/CCMS/CaseManagement/CaseServices.wsdl'
    }

    wsdl('Schema/BusinessServices/CCMS/CaseManagement/DocumentServices.wsdl') {
        xjcarg("-XautoNameResolution")
        wsdlLocation = 'classpath:wsdl/Schema/BusinessServices/CCMS/CaseManagement/DocumentServices.wsdl'
    }

    wsdl('Schema/BusinessServices/CCMS/CaseManagement/GetCoverSheet.wsdl') {
        xjcarg("-XautoNameResolution")
        wsdlLocation = 'classpath:wsdl/Schema/BusinessServices/CCMS/CaseManagement/GetCoverSheet.wsdl'
    }

    wsdl('Schema/BusinessServices/CCMS/UserManagement/UpdateUser.wsdl') {
        xjcarg("-XautoNameResolution")
        wsdlLocation = 'classpath:wsdl/Schema/BusinessServices/CCMS/UserManagement/UpdateUser.wsdl'
    }

    wsdl('Schema/BusinessServices/CCMS/CaseManagement/SubmitProviderRequest.wsdl') {
        xjcarg("-XautoNameResolution")
        wsdlLocation = 'classpath:wsdl/Schema/BusinessServices/CCMS/CaseManagement/SubmitProviderRequest.wsdl'
    }

    wsdl('Schema/BusinessServices/CCMS/Finance/CreateInvoice.wsdl') {
        xjcarg("-XautoNameResolution")
        wsdlLocation = 'classpath:wsdl/Schema/BusinessServices/CCMS/Finance/CreateInvoice.wsdl'
    }

    wsdl('Schema/BusinessServices/CCMS/Finance/GetInvoiceDetails.wsdl') {
        xjcarg("-XautoNameResolution")
        wsdlLocation = 'classpath:wsdl/Schema/BusinessServices/CCMS/Finance/GetInvoiceDetails.wsdl'
    }
}

test {
    useJUnitPlatform()

    jvmArgs(
            "-javaagent:${configurations.mockitoAgent.asPath}",
            "-Xshare:off",
            "-Dnet.bytebuddy.safe=true" // Prevent unsafe memory access, see https://github.com/raphw/byte-buddy/issues/1803
    )

    finalizedBy jacocoTestReport
}

jacocoTestReport {
    afterEvaluate {
        classDirectories.setFrom(files(classDirectories.files.collect {
            fileTree(dir: it, exclude: ['**/SoaGatewayApplication.class',
                                        'org/oasis_open/docs/wss/**',
                                        'uk/gov/legalservices/**',
                                        'uk/gov/gsi/legalaid/**'
            ])
        }))
    }
}

jacocoTestCoverageVerification {
    afterEvaluate {
        classDirectories.setFrom(files(classDirectories.files.collect {
            fileTree(dir: it, exclude: ['**/SoaGatewayApplication.class',
                                        'org/oasis_open/docs/wss/**',
                                        'uk/gov/legalservices/**',
                                        'uk/gov/gsi/legalaid/**'
            ])
        }))
    }
}

checkstyleMain {
    //exclude auto generated files
    exclude '**/uk/gov/legalservices/**'
    exclude '**/uk/gov/gsi/legalaid/**'
    exclude '**/org/oasis_open/**'
}

spotless {
    java {
        target 'src/*/java/**/*.java'
        importOrder()
        removeUnusedImports()
        cleanthat()
        googleJavaFormat('1.34.1')
    }
}

/**
 * Automatically installs the git pre-commit hook to run spotlessApply.
 */
tasks.register('installGitHooks', Copy) {
    from "../scripts/pre-commit"
    into "${rootProject.rootDir}/.git/hooks"

    // Gradle 9.x replacement for fileMode
    filePermissions {
        unix(0755)
    }
}

// Linked to compileJava so it installs on the first build
compileJava.dependsOn installGitHooks

