SOA_SERVICE_URL: http://localhost:8051

server:
  port: 8007

springdoc:
  enable-spring-security: false

laa:
  ccms:
    soa-gateway:
      username: soa-user
      password: soa-password
      contract-details:
        service-port: 7777
        service-url: http://localhost:${laa.ccms.soa-gateway.contract-details.service-port}/mockGetContractDetailsSOAPBinding
  springboot:
    starter:
      oauth2:
        resourceserver:
          jwt:
            tenants:
              - issuer-uri: https://login.microsoftonline.com/xxxxxxxx-xxxx-xxxx-xxxx-xxxxxxxxxxxx/v2.0
                audiences:
                  - xxxxxxxx-xxxx-xxxx-xxxx-xxxxxxxxxxxx
        scopes-claim-path: scp
        authorized-roles: '[
            {
                "name": "test-role",
                "uris": [
                    "/**"
                ]
            }
        ]'
        unprotected-uris: [ "/actuator/**", "/swagger-ui.html", "/swagger-ui/**", "/v3/api-docs/**", "/favicon.ico", "/open-api-specification.yml" ]

